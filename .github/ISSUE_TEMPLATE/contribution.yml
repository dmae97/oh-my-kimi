name: Contribution Proposal
description: Propose a focused change or feature
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** Read the repository's `CONTRIBUTING.md`.

        Keep the proposal focused.
        Explain the problem before the implementation.

  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: Be specific and concise.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How? (optional)
      description: Brief technical approach if you have one in mind.
    validations:
      required: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    env:
      COREPACK_HOME: /tmp/omk-corepack
    steps:
      - name: Checkout
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Setup Go
        # actions/setup-go v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.x'
          cache-dependency-path: packages/initcheck/go.sum

      - name: Verify native init checker
        run: |
          cd packages/initcheck
          go vet ./...
          go test -race -shuffle=on -count=1 ./...
          make verify-ghidra

      - name: Install system dependencies
        run: |
          # Hosted runners occasionally ship broken Microsoft apt mirrors.
          sudo rm -f \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/azure-cli.list \
            2>/dev/null || true
          sudo apt-get update -o Acquire::AllowReleaseInfoChange=true
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev \
            librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Verify release consistency receipt
        id: verify_receipt
        run: node packages/coding-agent/dist/verify-ci.js

      - name: Upload release consistency receipt
        if: always() && steps.verify_receipt.outcome != 'skipped'
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-consistency
          path: .omk/ci-evidence
          if-no-files-found: error

      - name: Test
        run: npm test

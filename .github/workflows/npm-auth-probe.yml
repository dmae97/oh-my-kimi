name: npm auth probe

# Temporary diagnostic: confirms whether the NPM_TOKEN secret reaching the
# runner is the intended token, and whether the registry answers the runner
# differently than a developer machine. Delete once npm publishing is fixed.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - name: Fingerprint the secret without revealing it
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "secret_present=no"
            exit 0
          fi
          echo "secret_present=yes"
          echo "secret_length=${#NPM_TOKEN}"
          echo "secret_sha256_prefix=$(printf '%s' "${NPM_TOKEN}" | sha256sum | cut -c1-16)"

      - name: Ask the registry from this runner
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "runner_egress_ip=$(curl -sS https://api.ipify.org)"
          echo "--- PUT omk-ai (body [] cannot mutate a packument) ---"
          curl -sS -o /tmp/body.txt -w 'http_status=%{http_code}\n' \
            -X PUT \
            -H "Authorization: Bearer ${NPM_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "npm-command: publish" \
            -d '[]' \
            https://registry.npmjs.org/omk-ai
          cat /tmp/body.txt
          echo

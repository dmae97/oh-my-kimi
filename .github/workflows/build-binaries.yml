name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.12.0)"
        required: true
        type: string
      source_ref:
        description: >-
          Source ref to build/publish. Defaults to the tag; use only for
          release recovery.
        required: false
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COREPACK_HOME: /tmp/omk-corepack
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: >-
        ${{ github.event.inputs.source_ref || github.event.inputs.tag ||
        github.ref_name }}
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Build binaries
        run: ./scripts/build-binaries.sh

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix

          # Extract changelog section for this version
          cd packages/coding-agent
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" \
            CHANGELOG.md > /tmp/release-notes.md

          # If empty, use a default message
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${VERSION}" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists;" \
              "skipping binary upload."
            exit 0
          fi

          cd packages/coding-agent/binaries

          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file /tmp/release-notes.md \
            omk-darwin-arm64.tar.gz \
            omk-darwin-x64.tar.gz \
            omk-linux-x64.tar.gz \
            omk-linux-arm64.tar.gz \
            omk-windows-x64.zip \
            omk-windows-arm64.zip

  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      COREPACK_HOME: /tmp/omk-corepack
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: >-
        ${{ github.event.inputs.source_ref || github.event.inputs.tag ||
        github.ref_name }}
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Install system dependencies
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/azure-cli.list \
            2>/dev/null || true
          sudo apt-get update -o Acquire::AllowReleaseInfoChange=true
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev \
            librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify release artifacts are committed
        run: |
          # This generated catalog can drift as upstream model data changes.
          # Surface drift, but require every other release artifact to match.
          git diff --stat -- packages/ai/src/models.generated.ts
          git diff --exit-code -- . \
            ':(exclude)packages/ai/src/models.generated.ts'

      - name: Publish npm packages
        env:
          # Token fallback: npm falls back to NODE_AUTH_TOKEN when the OIDC
          # trusted-publisher exchange does not match this repository.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs

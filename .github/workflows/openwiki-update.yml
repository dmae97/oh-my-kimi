name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions: {}

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check required secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: |
          echo "GEMINI_API_KEY is not set on this repository."
          echo "Add it under Settings > Secrets and variables > Actions, or switch"
          echo "OPENWIKI_PROVIDER to anthropic (ANTHROPIC_API_KEY) and rerun."
          exit 1

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0
          # Do not expose repository-write credentials to the generated docs tool.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # The workflow-local lockfile pins the complete dependency graph.
        run: npm ci --prefix .github/openwiki --ignore-scripts

      - name: Run OpenWiki
        run: .github/openwiki/node_modules/.bin/openwiki code --update --print
        env:
          # Default provider: Google AI Studio key. Alternatives: anthropic
          # (ANTHROPIC_API_KEY) or openai-chatgpt (OAuth, local runs only).
          OPENWIKI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWIKI_MODEL_ID: "gemini-3.5-flash-lite"
          # Free tier allows ~15 requests/minute; the agent loop bursts past that.
          # Retries plus --update resumability (openwiki/.last-update.json) absorb
          # quota aborts; rerunning continues where the previous pass stopped.
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "8"

      - name: Validate wiki integrity
        run: node scripts/check-openwiki.mjs

      # Spec 014 blockers 3 and 4, before anything leaves this job. The
      # generator is a model writing into a checkout: if it can touch AGENTS.md,
      # CLAUDE.md, or this workflow, then content it reads can rewrite the rules
      # agents follow or the job itself. Fail closed here rather than uploading.
      - name: Enforce generator output allowlist and scans
        run: node scripts/check-openwiki-output.mjs

      - name: Upload generated wiki
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: openwiki-update-${{ github.run_id }}
          # openwiki/ only. Authority surfaces are never carried out of this job.
          path: openwiki
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: update
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download generated wiki
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openwiki-update-${{ github.run_id }}
          path: openwiki

      # Spec 014 blocker 4 requires the scans to pass again here. This job holds
      # write and pull-request permissions that the generating job does not, and
      # the artifact crossed a job boundary to reach it, so it is re-checked as
      # untrusted input rather than trusted because an earlier job approved it.
      - name: Re-enforce allowlist and scans before publishing
        run: node scripts/check-openwiki-output.mjs

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # openwiki/ only; an authority-surface edit can never reach a PR.
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
